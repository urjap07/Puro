
name: Puro Local CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker
        run: docker --version

      - name: Verify Kubernetes
        run: kubectl get nodes


      - name: Build Docker Image
        run: |
          docker build -t localhost:5001/puro-website:${GITHUB_SHA} .

      - name: Push Docker Image
        run: |
          docker push localhost:5001/puro-website:${GITHUB_SHA}

      - name: Update Kubernetes Manifest
        run: |
          sed -i '' "s|image: .*puro-website:.*|image: localhost:5001/puro-website:${GITHUB_SHA}|" k8s/deployment.yaml

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Deploy Puro image ${GITHUB_SHA}" || echo "No manifest changes"
          git push origin HEAD:main

