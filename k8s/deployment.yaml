apiVersion: apps/v1
kind: Deployment

metadata:
  name: puro-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: puro

  template:
    metadata:
      labels:
        app: puro

    spec:
      containers:
        - name: puro-container
          image: localhost:5001/puro-website:9ec87ba87b81445907b5491d317e9bb43daadc18
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
